# The door to the Sprite, a Fly machine with the nginx image. The image fills in ${EDGE_SECRET}.
# It stores nothing: no access log, no cache. Set up with ops/edge.sh.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $host $moved { www.builddoctor.app builddoctor.app; default ''; }

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_tokens off;
  access_log off;
  error_log stderr crit;
  client_max_body_size 1m;
  resolver [fdaa::3] valid=60s;

  # Fly ends TLS and tells the scheme.
  if ($http_x_forwarded_proto = http) { return 301 https://$host$request_uri; }
  if ($moved) { return 301 https://$moved$request_uri; }

  # The agent works inside the Sprite; nobody needs this from outside.
  location /api { return 404; }

  location / {
    set $sprite builddoctor-b6tq7.sprites.app;
    proxy_pass https://$sprite;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $sprite;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $sprite;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Builddoctor-Edge "${EDGE_SECRET}";
    proxy_set_header X-Builddoctor-Client $http_fly_client_ip;
    # Nothing else that could pass for an address.
    proxy_set_header Sprite-Client-Ip "";
    proxy_set_header Fly-Client-Ip "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-Ip "";
    proxy_connect_timeout 30s; # the Sprite may have to wake up
    proxy_read_timeout 1h;     # the live connection
    proxy_send_timeout 1h;
  }
}
